<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<title id="title">Nativebox cube orbit mark</title>
<desc id="desc">A dimensional blue and violet cube surrounded by a cyan-to-purple orbital ring on a dark background.</desc>
<defs>
  <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22e6ff"/><stop offset=".52" stop-color="#087cff"/><stop offset="1" stop-color="#3520ff"/></linearGradient>
  <linearGradient id="left" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#d8faff"/><stop offset=".55" stop-color="#8dbfff"/><stop offset="1" stop-color="#2865d9"/></linearGradient>
  <linearGradient id="right" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d5d9ff"/><stop offset=".5" stop-color="#777fca"/><stop offset="1" stop-color="#242d88"/></linearGradient>
  <linearGradient id="orbit" x1="0" y1="0" x2="1" y2=".15"><stop stop-color="#20eaff"/><stop offset=".42" stop-color="#087dff"/><stop offset=".72" stop-color="#552dff"/><stop offset="1" stop-color="#e04aff"/></linearGradient>
  <radialGradient id="bg"><stop stop-color="#071b43"/><stop offset="1" stop-color="#020612"/></radialGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="900" height="900" fill="url(#bg)"/>
<!-- Rear arc of the orbit -->
<path d="M176 503 C224 327 631 245 748 365 C810 430 741 562 590 648" fill="none" stroke="url(#orbit)" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>
<!-- Cube -->
<path d="M450 174 L665 291 L450 414 L235 291 Z" fill="url(#top)" stroke="#39dfff" stroke-opacity=".8" stroke-width="3"/>
<path d="M235 291 L450 414 L450 680 L235 557 Z" fill="url(#left)" stroke="#a5eaff" stroke-opacity=".7" stroke-width="2"/>
<path d="M665 291 L450 414 L450 680 L665 557 Z" fill="url(#right)" stroke="#b8c3ff" stroke-opacity=".55" stroke-width="2"/>
<!-- Front orbit arc -->
<path d="M590 648 C421 737 199 691 126 573 C70 482 145 389 259 333" fill="none" stroke="url(#orbit)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
</svg>